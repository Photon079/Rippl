services:
  - type: web
    name: rippl
    runtime: docker
    plan: free
    region: oregon
    branch: main
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /
    autoDeploy: true
    envVars:
      - key: PORT
        value: "10000"
      - key: GROQ_API_KEY
        sync: false
